<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listing map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/style.css?v=9">
</head>
<body class="map-page">
  <div class="title-row">
    <h1 id="page-title">Listing map</h1>
    <label class="user-switch">Account
      <select id="user-select" aria-label="Switch account" hidden></select>
    </label>
  </div>
  <p class="hint map-intro">
    <a href="/" id="back-to-queue">Back to apply queue</a>
  </p>


  <div class="toolbar map-toolbar">
    <label>Search
      <input type="search" id="filter-search" placeholder="Title, city, address…" autocomplete="off">
    </label>
    <label>Status
      <select id="filter-status">
        <option value="to_apply">To apply</option>
        <option value="applied">Applied</option>
        <option value="replied">Replied</option>
        <option value="visited">Visited</option>
        <option value="skipped">Skipped</option>
        <option value="gone">Gone</option>
        <option value="all">All</option>
      </select>
    </label>
    <label>Source
      <select id="filter-source">
        <option value="all">All</option>
        <option value="craigslist">Craigslist</option>
        <option value="facebook">Facebook</option>
        <option value="zillow">Zillow</option>
      </select>
    </label>
    <label>Bathroom
      <select id="filter-bath">
        <option value="all">All</option>
        <option value="private">Private bathroom</option>
        <option value="shared">Shared bathroom</option>
        <option value="unknown">Unknown</option>
      </select>
    </label>
    <label>Max $/mo
      <input type="number" id="filter-price" placeholder="Any" min="0" step="50">
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-liked"> Liked only
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-memo"> Memo only
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-multiroom"> 2+ rooms in house
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-scam" checked> Exclude scam likely
    </label>
    <span class="row-count" id="pin-count"></span>
  </div>
  <p class="map-legend" id="map-hint">Loading…</p>

  <div class="map-split">
    <div class="map-pane">
      <div id="map"></div>
    </div>
    <aside class="map-list" id="map-list" aria-label="Filtered listings"></aside>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/map.js?v=16" defer></script>
  <script src="/mobile.js?v=3" defer></script>
</body>
</html>
