<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looking for Room</title>
  <link rel="stylesheet" href="/style.css?v=9">
</head>
<body>
  <div class="title-row">
    <h1 id="page-title">Looking for Room</h1>
    <label class="user-switch">Account
      <select id="user-select" aria-label="Switch account" hidden></select>
    </label>
  </div>
  <p class="intro">
    <a href="/map.html">Map</a>
    <span class="intro-sep" id="scrape-sep" hidden>·</span>
    <button type="button" id="scrape-btn" class="link-btn primary" style="display:none;">Run Scrape</button>
    <span id="scrape-status" class="hint" style="display: none;"></span>
    <span class="intro-sep" id="updated-sep" hidden>·</span>
    <span class="intro-updated" id="updated-hint" hidden></span>
  </p>
  <p class="hint system-hint" id="api-hint" hidden></p>


  <div class="stats" id="stats">
    <span class="stat">To apply <strong id="stat-to-apply">…</strong></span>
    <span class="stat">Applied <strong id="stat-applied">…</strong></span>
    <span class="stat">Replied <strong id="stat-replied">…</strong></span>
    <span class="stat">Visited <strong id="stat-visited">…</strong></span>
    <span class="stat">Skipped <strong id="stat-skipped">…</strong></span>
    <span class="stat">Gone <strong id="stat-gone">…</strong></span>
    <span class="stat" id="stat-pending-score-wrap" hidden>Pending score <strong id="stat-pending-score">0</strong></span>
  </div>
  <div class="toolbar">
    <label>Search
      <input type="search" id="filter-search" placeholder="Title, city, address…" autocomplete="off">
    </label>
    <label>Status
      <select id="filter-status">
        <option value="to_apply">To apply</option>
        <option value="applied">Applied</option>
        <option value="replied">Replied</option>
        <option value="visited">Visited</option>
        <option value="skipped">Skipped</option>
        <option value="gone">Gone</option>
        <option value="all">All</option>
      </select>
    </label>
    <label>Source
      <select id="filter-source">
        <option value="all">All</option>
        <option value="craigslist">Craigslist</option>
        <option value="facebook">Facebook</option>
        <option value="zillow">Zillow</option>
      </select>
    </label>
    <label>Bathroom
      <select id="filter-bath">
        <option value="all">All</option>
        <option value="private">Private bathroom</option>
        <option value="shared">Shared bathroom</option>
        <option value="unknown">Unknown</option>
      </select>
    </label>
    <label>Max $/mo
      <input type="number" id="filter-price" placeholder="Any" min="0" step="50">
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-liked"> Liked only
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-memo"> Memo only
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-multiroom"> 2+ rooms in house
    </label>
    <label class="check-label">
      <input type="checkbox" id="filter-scam" checked> Exclude scam likely
    </label>
    <span class="row-count" id="row-count"></span>
  </div>

  <div class="table-wrap">
    <table id="queue-table">
      <thead>
        <tr>
          <th data-sort="index" class="sorted-desc">#</th>
          <th data-sort="liked" class="star-col" title="Liked">★</th>
          <th data-sort="address">Address</th>
          <th data-sort="title">Title</th>
          <th data-sort="details">Details(Click)</th>
          <th data-sort="price">$/mo</th>
          <th data-sort="sqft">Sqft</th>
          <th data-sort="movein">Move-in</th>
          <th data-sort="posted">Posted</th>
          <th data-sort="scraped">Scraped</th>
          <th data-sort="score">Score</th>
          <th data-sort="status">Status</th>
          <th data-sort="source">Source</th>
          <th class="no-sort">Actions</th>
        </tr>
      </thead>
      <tbody id="queue-body">
        <tr><td colspan="14" class="hint">Loading listings…</td></tr>
      </tbody>
    </table>
  </div>

  <nav class="pagination" id="pagination" aria-label="Listing pages"></nav>

  <div class="toast" id="toast"></div>
  <script src="/app.js?v=28" defer></script>
  <script src="/mobile.js?v=3" defer></script>
</body>
</html>
