<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply queue</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header>
      <h1>Apply queue</h1>
      <p class="sub">One message for every listing. <strong>Apply</strong> saves a Gmail draft (when API is on) or opens compose.</p>
      <p class="stats" id="stats">Loading…</p>
    </header>

    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" data-tab="to_apply">To apply</button>
        <button class="tab" data-tab="applied">Applied</button>
        <button class="tab" data-tab="replied">Replied</button>
      </div>
      <span class="api-pill offline" id="api-pill">Checking API…</span>
    </div>

    <div class="filter-bar">
      <input class="filter-input" type="search" id="search" placeholder="Search title or neighborhood" autocomplete="off">
      <select class="filter-select" id="source-filter" aria-label="Source">
        <option value="all">All sources</option>
        <option value="craigslist">Craigslist</option>
        <option value="facebook">Facebook</option>
      </select>
      <input class="filter-input filter-price" type="number" id="max-price" placeholder="Max $/mo" min="0" step="50" aria-label="Max price per month">
      <label class="filter-check">
        <input type="checkbox" id="move-in-only">
        Move-in window
      </label>
      <select class="filter-select" id="sort" aria-label="Sort by">
        <option value="score-desc">Score (high first)</option>
        <option value="price-asc">Price (low first)</option>
        <option value="price-desc">Price (high first)</option>
        <option value="neighborhood-asc">Neighborhood A–Z</option>
        <option value="title-asc">Title A–Z</option>
        <option value="source-asc">Source</option>
      </select>
    </div>

    <details class="message-box">
      <summary>Message template</summary>
      <pre id="message-pre"></pre>
    </details>

    <section class="list" id="list">
      <p class="empty">Loading listings…</p>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js" defer></script>
</body>
</html>
