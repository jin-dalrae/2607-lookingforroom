<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SF Room Finder</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #fff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --blue: #0071e3;
      --border: #d2d2d7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.5; }
    nav { display: flex; flex-direction: column; gap: 0.75rem; }
    a {
      display: block;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { background: #f0f6ff; border-color: #b3d7ff; }
    a span { display: block; font-size: 0.85rem; color: var(--muted); font-weight: 400; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>SF Room Finder</h1>
    <p>Private dashboards for listing outreach and follow-ups.</p>
    <nav>
      <a href="/listing-mails-communication.html">
        Communication tracker
        <span>Sent inquiries, replies, and follow-up status</span>
      </a>
      <a href="/batch_apply.html">
        Batch apply
        <span>Draft messages for top-ranked listings</span>
      </a>
    </nav>
  </main>
</body>
</html>
